name: tests

# The CPU suite is the whole suite that can run without a GPU: the engine's scheduler,
# request lifecycle, paging, prefix cache, sampler, backend registry, model hooks and
# HTTP surface. Kernel and end-to-end tests are marked `cuda` and are deselected here;
# they run on the GPU boxes and their results are recorded in docs/.
#
# This exists because the failure it prevents already happened twice: a test that
# passed only where Triton was installed, and a module-scope Triton import that turned
# `pytest -q` into a collection error on any machine without a GPU.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch, no CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,server]"
      - name: Test
        run: python -m pytest -q
